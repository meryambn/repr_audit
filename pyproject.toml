[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repr-audit"
version = "0.1.0"
description = "A library for auditing transformer representation geometry: anisotropy, self-similarity, and semantic onset depth."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Benalia Meriem", email = "mi.benalia@gmail.com" }]
keywords = ["nlp", "transformers", "representation-learning", "anisotropy", "interpretability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.38.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "tqdm>=4.65.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "pre-commit>=3.5.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/meryambn/repr-audit"
Documentation = "https://meryambn.github.io/repr-audit"
Repository = "https://github.com/meryambn/repr-audit"
Issues = "https://github.com/meryambn/repr-audit/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/repr_audit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]
ignore = ["E501", "E741", "N806", "N803"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=repr_audit --cov-report=term-missing"

[tool.coverage.run]
source = ["src/repr_audit"]
